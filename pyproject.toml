[tool.mypy]
python_version = "3.14"
files = ["back/src", "back/test"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Tests are checked for type errors in their bodies, not held to full annotation coverage.
module = ["back.test.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Annotated inline, but ships no py.typed marker and re-exports RandomWord implicitly.
module = ["wonderwords", "wonderwords.*"]
follow_untyped_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
# Unannotated, no stubs, and re-exports `parameterized` implicitly; only the tests use it.
module = ["parameterized", "parameterized.*"]
follow_untyped_imports = true
implicit_reexport = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults per instance.
"back/test/**" = ["RUF012"]

[tool.coverage.run]
source = ["back/src"]
branch = true

[tool.coverage.report]
# The whole backend's line and branch coverage, rounded down; raise it as coverage grows.
fail_under = 96
skip_covered = true
skip_empty = true
