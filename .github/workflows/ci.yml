name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m venv venv && venv/bin/pip install -r requirements.txt
      - run: venv/bin/python -m unittest discover -s back/test -t .

  frontend:
    name: Frontend types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx jest --config jest.ci.config.js --ci
      # front/build/ is tracked, so the check build goes outside the checkout.
      - run: npm run build
        env:
          BUILD_PATH: ${{ runner.temp }}/build

  contract:
    name: Generated API client is current
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: python -m venv venv && venv/bin/pip install -r requirements.txt
      - run: npm ci
        working-directory: front
      - run: npm run gen:api:check
        working-directory: front
